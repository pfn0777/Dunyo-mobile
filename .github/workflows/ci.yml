name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same branch to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Real Postgres for db-tests/*.concurrent.test.ts (PGlite is
    # single-connection and cannot exercise row locking). Same image family
    # as deploy/docker-compose.yml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dunyo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d dunyo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/dunyo_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Node version
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + PGlite + real-Postgres DB tests
        run: npm test

      - name: Build web app
        run: npm run build

      # The Mini App bundle is served publicly, so a secret reaching web/dist
      # is a live leak. The leading '!' inverts grep: the step FAILS on a hit.
      - name: Scan bundle for leaked secrets
        run: '! grep -rE "BOT_TOKEN|POSTGRES_PASSWORD|WEBHOOK_SECRET|DATABASE_URL" web/dist'

      # The compiled API must run under plain Node ESM, which dev (tsx) and
      # vitest both paper over. Prove the real entrypoint boots.
      - name: Boot the compiled API
        env:
          DATABASE_URL: postgres://u:p@127.0.0.1:5999/none
          TELEGRAM_BOT_TOKEN: '1:ci'
          TELEGRAM_WEBHOOK_SECRET: ci
          WEBAPP_URL: http://localhost
          MEDIA_DIR: ./media
          PORT: '3993'
        run: |
          node api/dist/index.js &
          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:3993/health" > /dev/null; then
              echo "API booted and answered /health"
              exit 0
            fi
            sleep 1
          done
          echo "API did not answer /health in time" >&2
          exit 1

  # UI smoke test against the mock client (VITE_MOCK=1), no backend needed.
  # Separate job so it runs in parallel and does not slow the unit job.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Node version
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke test
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
